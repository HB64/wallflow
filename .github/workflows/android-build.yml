
name: Build and publish Android APK

on:
  push:
    branches: [ "main" ]
    paths:
      - "android-app/**"
      - ".github/workflows/android-build.yml"
    tags:
      - "v*"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Verify keystore checksum
        run: |
          ACTUAL=$(sha256sum app/release.keystore | cut -d' ' -f1)
          EXPECTED="297d0491eeb53fc866a2485567c432ed3fb0925efa58634250683cd1aa65664e"
          echo "Actual:   $ACTUAL"
          echo "Expected: $EXPECTED"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Keystore checksum mismatch - de KEYSTORE_BASE64 secret komt niet overeen met het bestand. Opnieuw plakken zonder extra spaties/regeleinden."
            exit 1
          fi
          echo "Keystore checksum OK"

      - name: Build release APK
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # Vriendelijkere bestandsnaam dan het standaard "app-release.apk".
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/WallFlowScreensaver.apk

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wallflow-screensaver-apk
          path: android-app/app/build/outputs/apk/release/WallFlowScreensaver.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android-app/app/build/outputs/apk/release/WallFlowScreensaver.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
